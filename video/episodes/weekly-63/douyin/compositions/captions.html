<div id="captions-root" data-composition-id="captions" data-width="1080" data-height="1920" data-duration="158.372">
<div class="cap clip" id="cap-0" data-start="0.7" data-duration="1.7" data-track-index="0"><span>大家好，我是山月</span></div>
<div class="cap clip" id="cap-1" data-start="2.4" data-duration="2.881" data-track-index="0"><span>这里是开发者 AI 周刊第 63 期</span></div>
<div class="cap clip" id="cap-2" data-start="5.451" data-duration="2.16" data-track-index="0"><span>这一期的卷首想说</span></div>
<div class="cap clip" id="cap-3" data-start="7.611" data-duration="1.34" data-track-index="0"><span>Agent 的成本</span></div>
<div class="cap clip" id="cap-4" data-start="8.951" data-duration="1.665" data-track-index="0"><span>藏在你离开的那几分钟</span></div>
<div class="cap clip" id="cap-5" data-start="11.016" data-duration="2.56" data-track-index="0"><span>你让编码 Agent 改一个模块</span></div>
<div class="cap clip" id="cap-6" data-start="13.576" data-duration="2.837" data-track-index="0"><span>它读文件、跑测试，一轮接一轮</span></div>
<div class="cap clip" id="cap-7" data-start="16.413" data-duration="0.661" data-track-index="0"><span>很快</span></div>
<div class="cap clip" id="cap-8" data-start="17.244" data-duration="2.02" data-track-index="0"><span>然后它停下来问你</span></div>
<div class="cap clip" id="cap-9" data-start="19.264" data-duration="2.099" data-track-index="0"><span>这个接口要不要保持向后兼容？</span></div>
<div class="cap clip" id="cap-10" data-start="21.533" data-duration="3.1" data-track-index="0"><span>你正好去吃午饭，一小时后回来</span></div>
<div class="cap clip" id="cap-11" data-start="24.633" data-duration="1.112" data-track-index="0"><span>才答了一句要</span></div>
<div class="cap clip" id="cap-12" data-start="25.915" data-duration="1.76" data-track-index="0"><span>接下来那次请求</span></div>
<div class="cap clip" id="cap-13" data-start="27.675" data-duration="2.697" data-track-index="0"><span>比之前任何一轮都慢，也都更贵</span></div>
<div class="cap clip" id="cap-14" data-start="30.772" data-duration="2.04" data-track-index="0"><span>原因在 KV 缓存</span></div>
<div class="cap clip" id="cap-15" data-start="32.812" data-duration="1.54" data-track-index="0"><span>Agent 每一轮</span></div>
<div class="cap clip" id="cap-16" data-start="34.352" data-duration="2.278" data-track-index="0"><span>都会把整段对话重新发给模型</span></div>
<div class="cap clip" id="cap-17" data-start="36.8" data-duration="2.88" data-track-index="0"><span>服务端还留着上一轮算好的前缀</span></div>
<div class="cap clip" id="cap-18" data-start="39.68" data-duration="2.78" data-track-index="0"><span>就能跳过重算，留不住</span></div>
<div class="cap clip" id="cap-19" data-start="42.46" data-duration="1.813" data-track-index="0"><span>就得从头 prefill 一遍</span></div>
<div class="cap clip" id="cap-20" data-start="44.443" data-duration="2.12" data-track-index="0"><span>丢缓存有两种方式</span></div>
<div class="cap clip" id="cap-21" data-start="46.563" data-duration="2.26" data-track-index="0"><span>一种是显存满了被挤掉</span></div>
<div class="cap clip" id="cap-22" data-start="48.823" data-duration="1.88" data-track-index="0"><span>另一种是人停太久</span></div>
<div class="cap clip" id="cap-23" data-start="50.703" data-duration="1.428" data-track-index="0"><span>TTL 到期被扔掉</span></div>
<div class="cap clip" id="cap-24" data-start="52.301" data-duration="2.796" data-track-index="0"><span>而现在的基准，几乎只测前一种</span></div>
<div class="cap clip" id="cap-25" data-start="55.497" data-duration="4.1" data-track-index="0"><span>Siddhant Khare 这周整理了一篇推理实测综述</span></div>
<div class="cap clip" id="cap-26" data-start="59.597" data-duration="1.096" data-track-index="0"><span>数字很直观</span></div>
<div class="cap clip" id="cap-27" data-start="60.863" data-duration="1.56" data-track-index="0"><span>在工具循环里</span></div>
<div class="cap clip" id="cap-28" data-start="62.423" data-duration="2.036" data-track-index="0"><span>缓存命中率是 97%</span></div>
<div class="cap clip" id="cap-29" data-start="64.629" data-duration="2.94" data-track-index="0"><span>可你离开一小时，下一次请求</span></div>
<div class="cap clip" id="cap-30" data-start="67.569" data-duration="2.38" data-track-index="0"><span>只有 18% 的输入还在缓存里</span></div>
<div class="cap clip" id="cap-31" data-start="70.349" data-duration="4.827" data-track-index="0"><span>免费推理网关 FreeInference 统计了一万两千个会话</span></div>
<div class="cap clip" id="cap-32" data-start="75.346" data-duration="1.38" data-track-index="0"><span>工具调用之间</span></div>
<div class="cap clip" id="cap-33" data-start="76.726" data-duration="1.86" data-track-index="0"><span>平均命中率 97%</span></div>
<div class="cap clip" id="cap-34" data-start="78.586" data-duration="2.4" data-track-index="0"><span>Agent 问你问题后是 92%</span></div>
<div class="cap clip" id="cap-35" data-start="80.986" data-duration="2.318" data-track-index="0"><span>你闲置后只剩 84%</span></div>
<div class="cap clip" id="cap-36" data-start="83.474" data-duration="2.26" data-track-index="0"><span>停十五到三十分钟</span></div>
<div class="cap clip" id="cap-37" data-start="85.734" data-duration="3.5" data-track-index="0"><span>大约 58%，停一小时以上</span></div>
<div class="cap clip" id="cap-38" data-start="89.234" data-duration="1.343" data-track-index="0"><span>只有 18%</span></div>
<div class="cap clip" id="cap-39" data-start="90.747" data-duration="2.7" data-track-index="0"><span>所有停顿里，丢缓存最多的</span></div>
<div class="cap clip" id="cap-40" data-start="93.447" data-duration="1.081" data-track-index="0"><span>是人自己</span></div>
<div class="cap clip" id="cap-41" data-start="94.928" data-duration="1.11" data-track-index="0"><span>更值得注意的</span></div>
<div class="cap clip" id="cap-42" data-start="96.038" data-duration="1.932" data-track-index="0"><span>是基准和现实的落差</span></div>
<div class="cap clip" id="cap-43" data-start="98.14" data-duration="2.28" data-track-index="0"><span>在 15 分钟的 TTL 下</span></div>
<div class="cap clip" id="cap-44" data-start="100.42" data-duration="2.1" data-track-index="0"><span>真人会话要比缓存永不过期</span></div>
<div class="cap clip" id="cap-45" data-start="102.52" data-duration="3.093" data-track-index="0"><span>多 prefill 60.9% 的 token</span></div>
<div class="cap clip" id="cap-46" data-start="105.783" data-duration="4.12" data-track-index="0"><span>微软看了一周 Copilot 编码 Agent 的流量</span></div>
<div class="cap clip" id="cap-47" data-start="109.903" data-duration="2.34" data-track-index="0"><span>同一轮内命中率 90%</span></div>
<div class="cap clip" id="cap-48" data-start="112.243" data-duration="2.06" data-track-index="0"><span>跨轮次只有 55%</span></div>
<div class="cap clip" id="cap-49" data-start="114.473" data-duration="1.94" data-track-index="0"><span>我们天天看的推理基准</span></div>
<div class="cap clip" id="cap-50" data-start="116.413" data-duration="1.594" data-track-index="0"><span>恰好漏掉了最贵的那段</span></div>
<div class="cap clip" id="cap-51" data-start="118.407" data-duration="1.88" data-track-index="0"><span>当然也有保留意见</span></div>
<div class="cap clip" id="cap-52" data-start="120.287" data-duration="2.855" data-track-index="0"><span>这些数字大多来自预印本和厂商自测</span></div>
<div class="cap clip" id="cap-53" data-start="123.312" data-duration="2.04" data-track-index="0"><span>不同上游的差异也很大</span></div>
<div class="cap clip" id="cap-54" data-start="125.352" data-duration="1.26" data-track-index="0"><span>有家供应商</span></div>
<div class="cap clip" id="cap-55" data-start="126.612" data-duration="1.834" data-track-index="0"><span>一小时后仍能保持高命中</span></div>
<div class="cap clip" id="cap-56" data-start="128.616" data-duration="3.88" data-track-index="0"><span>而且多留缓存，本身就要占显存</span></div>
<div class="cap clip" id="cap-57" data-start="132.496" data-duration="1.255" data-track-index="0"><span>这不是免费的午餐</span></div>
<div class="cap clip" id="cap-58" data-start="134.151" data-duration="3.64" data-track-index="0"><span>所以我的判断是：缓存命中率</span></div>
<div class="cap clip" id="cap-59" data-start="137.791" data-duration="2.28" data-track-index="0"><span>要按停顿类型拆开看</span></div>
<div class="cap clip" id="cap-60" data-start="140.071" data-duration="1.892" data-track-index="0"><span>别只看一个平均数</span></div>
<div class="cap clip" id="cap-61" data-start="142.133" data-duration="1.64" data-track-index="0"><span>用 Agent 的团队</span></div>
<div class="cap clip" id="cap-62" data-start="143.773" data-duration="2.86" data-track-index="0"><span>把需要人确认的问题攒到一起问</span></div>
<div class="cap clip" id="cap-63" data-start="146.633" data-duration="1.94" data-track-index="0"><span>压缩上下文、切换模型</span></div>
<div class="cap clip" id="cap-64" data-start="148.573" data-duration="2.202" data-track-index="0"><span>都当成缓存事件来记账</span></div>
<div class="cap clip" id="cap-65" data-start="150.945" data-duration="1.52" data-track-index="0"><span>调 API 的</span></div>
<div class="cap clip" id="cap-66" data-start="152.465" data-duration="2.64" data-track-index="0"><span>把 keepalive 设得略小于 TTL</span></div>
<div class="cap clip" id="cap-67" data-start="155.105" data-duration="3.067" data-track-index="0"><span>再用每个成功任务的成本来比较方案</span></div>
</div>
