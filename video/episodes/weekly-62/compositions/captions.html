<div id="captions-root" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="373.291">
<div class="cap clip" id="cap-0" data-start="0.7" data-duration="1.06" data-track-index="0"><span>大家好，我是山月</span></div>
<div class="cap clip" id="cap-1" data-start="1.76" data-duration="2.393" data-track-index="0"><span>这里是开发者 AI 周刊第 62 期</span></div>
<div class="cap clip" id="cap-2" data-start="4.323" data-duration="2.06" data-track-index="0"><span>这一期的卷首，想聊一件事</span></div>
<div class="cap clip" id="cap-3" data-start="6.383" data-duration="1.839" data-track-index="0"><span>别让大模型做是非题</span></div>
<div class="cap clip" id="cap-4" data-start="8.392" data-duration="2.068" data-track-index="0"><span>顺带，也算一算 Agent 的成本账</span></div>
<div class="cap clip" id="cap-5" data-start="11.44" data-duration="0.6" data-track-index="0"><span>上个月</span></div>
<div class="cap clip" id="cap-6" data-start="11.98" data-duration="2.475" data-track-index="0"><span>TypeSafe 发布了一个叫 Jev 的小模型</span></div>
<div class="cap clip" id="cap-7" data-start="14.625" data-duration="2.74" data-track-index="0"><span>三周之后，它变成了一个品类</span></div>
<div class="cap clip" id="cap-8" data-start="17.365" data-duration="2.28" data-track-index="0"><span>OpenAI 上线 Decisions API</span></div>
<div class="cap clip" id="cap-9" data-start="19.645" data-duration="1.28" data-track-index="0"><span>微软、Cloudflare</span></div>
<div class="cap clip" id="cap-10" data-start="20.925" data-duration="0.7" data-track-index="0"><span>Liquid AI</span></div>
<div class="cap clip" id="cap-11" data-start="21.625" data-duration="1.557" data-track-index="0"><span>Perplexity 也纷纷跟进</span></div>
<div class="cap clip" id="cap-12" data-start="23.882" data-duration="2.87" data-track-index="0"><span>决策模型不生成文字，只回答三类问题</span></div>
<div class="cap clip" id="cap-13" data-start="26.922" data-duration="3.26" data-track-index="0"><span>一句话为真的概率，在固定选项里选哪一个</span></div>
<div class="cap clip" id="cap-14" data-start="30.182" data-duration="1.523" data-track-index="0"><span>按评分标准打几分</span></div>
<div class="cap clip" id="cap-15" data-start="32.405" data-duration="2.2" data-track-index="0"><span>它一次前向计算就给出结果</span></div>
<div class="cap clip" id="cap-16" data-start="34.605" data-duration="2.294" data-track-index="0"><span>没有输出 token，所以又快又便宜</span></div>
<div class="cap clip" id="cap-17" data-start="37.069" data-duration="2.06" data-track-index="0"><span>OpenAI 的 Decisions API</span></div>
<div class="cap clip" id="cap-18" data-start="39.129" data-duration="2.46" data-track-index="0"><span>每百万输入 token 只要 0.1 美元</span></div>
<div class="cap clip" id="cap-19" data-start="41.589" data-duration="1.116" data-track-index="0"><span>而且不收输出费</span></div>
<div class="cap clip" id="cap-20" data-start="43.405" data-duration="2.012" data-track-index="0"><span>它真正改变的，是 Agent 的结构</span></div>
<div class="cap clip" id="cap-21" data-start="45.587" data-duration="2.58" data-track-index="0"><span>一个 Agent 的大量调用，其实不是在写</span></div>
<div class="cap clip" id="cap-22" data-start="48.167" data-duration="1.465" data-track-index="0"><span>而是在判</span></div>
<div class="cap clip" id="cap-23" data-start="49.802" data-duration="1.3" data-track-index="0"><span>这一步做完了吗？</span></div>
<div class="cap clip" id="cap-24" data-start="51.102" data-duration="1.06" data-track-index="0"><span>证据够不够？</span></div>
<div class="cap clip" id="cap-25" data-start="52.162" data-duration="1.513" data-track-index="0"><span>这封邮件属于哪个意图？</span></div>
<div class="cap clip" id="cap-26" data-start="53.845" data-duration="2.976" data-track-index="0"><span>过去，这些判断都交给主模型，多跑一轮</span></div>
<div class="cap clip" id="cap-27" data-start="57.521" data-duration="2.16" data-track-index="0"><span>更好的做法，是把判断拆出来</span></div>
<div class="cap clip" id="cap-28" data-start="59.681" data-duration="1.723" data-track-index="0"><span>交给决策模型当闸门</span></div>
<div class="cap clip" id="cap-29" data-start="61.574" data-duration="3.396" data-track-index="0"><span>置信度够高，就直接放行，不够，就退回大模型</span></div>
<div class="cap clip" id="cap-30" data-start="65.14" data-duration="2.4" data-track-index="0"><span>有人在 360 个用例上这样做</span></div>
<div class="cap clip" id="cap-31" data-start="67.54" data-duration="1.731" data-track-index="0"><span>主模型调用少了近三成</span></div>
<div class="cap clip" id="cap-32" data-start="69.971" data-duration="1.493" data-track-index="0"><span>但别急着全面替换</span></div>
<div class="cap clip" id="cap-33" data-start="71.634" data-duration="2.2" data-track-index="0"><span>有人用它预测一枚 70% 正面的偏币</span></div>
<div class="cap clip" id="cap-34" data-start="73.834" data-duration="2.369" data-track-index="0"><span>1000 次里，98% 都选了正面</span></div>
<div class="cap clip" id="cap-35" data-start="76.373" data-duration="3.13" data-track-index="0"><span>也就是说，它给的概率，并不等于真实的概率</span></div>
<div class="cap clip" id="cap-36" data-start="80.203" data-duration="2.04" data-track-index="0"><span>Simon Willison 也提醒</span></div>
<div class="cap clip" id="cap-37" data-start="82.243" data-duration="2.185" data-track-index="0"><span>你只拿到一个浮点数，拿不到理由</span></div>
<div class="cap clip" id="cap-38" data-start="84.598" data-duration="3.299" data-track-index="0"><span>给求职者排序这类高风险的场景，尤其要小心</span></div>
<div class="cap clip" id="cap-39" data-start="88.597" data-duration="1.268" data-track-index="0"><span>所以我的判断是</span></div>
<div class="cap clip" id="cap-40" data-start="90.035" data-duration="2.62" data-track-index="0"><span>决策模型适合当 Agent 里的闸门</span></div>
<div class="cap clip" id="cap-41" data-start="92.655" data-duration="0.928" data-track-index="0"><span>不适合当法官</span></div>
<div class="cap clip" id="cap-42" data-start="93.753" data-duration="3.1" data-track-index="0"><span>从有明确选项、有兜底、错了能回滚的判断开始</span></div>
<div class="cap clip" id="cap-43" data-start="96.853" data-duration="2.529" data-track-index="0"><span>阈值，用你自己的标注集测出来</span></div>
<div class="cap clip" id="cap-44" data-start="100.082" data-duration="2.069" data-track-index="0"><span>接下来，过一遍本周快讯</span></div>
<div class="cap clip" id="cap-45" data-start="102.321" data-duration="2.12" data-track-index="0"><span>Claude Code Projects 开始公开测试</span></div>
<div class="cap clip" id="cap-46" data-start="104.441" data-duration="2.52" data-track-index="0"><span>一个 Project 可以协调多个并行的云端线程</span></div>
<div class="cap clip" id="cap-47" data-start="106.961" data-duration="1.632" data-track-index="0"><span>共享同一个仓库和指令</span></div>
<div class="cap clip" id="cap-48" data-start="108.763" data-duration="3.38" data-track-index="0"><span>Cursor 现在能用手机遥控电脑上的本地 Agent</span></div>
<div class="cap clip" id="cap-49" data-start="112.143" data-duration="2.041" data-track-index="0"><span>Agent 仍然在你自己的电脑上执行</span></div>
<div class="cap clip" id="cap-50" data-start="114.354" data-duration="2" data-track-index="0"><span>Mistral Large 4 公开预览</span></div>
<div class="cap clip" id="cap-51" data-start="116.354" data-duration="2.26" data-track-index="0"><span>1T 总参数，52B 激活</span></div>
<div class="cap clip" id="cap-52" data-start="118.614" data-duration="1.255" data-track-index="0"><span>权重计划月底发布</span></div>
<div class="cap clip" id="cap-53" data-start="120.039" data-duration="0.88" data-track-index="0"><span>微软宣布</span></div>
<div class="cap clip" id="cap-54" data-start="120.919" data-duration="3.267" data-track-index="0"><span>Windows 上的 Agent 执行容器 MXC 正式可用</span></div>
<div class="cap clip" id="cap-55" data-start="124.656" data-duration="3.42" data-track-index="0"><span>OpenAI 给 GPT-6.1 Sol 加了 ultrafast 档位</span></div>
<div class="cap clip" id="cap-56" data-start="128.076" data-duration="1" data-track-index="0"><span>短上下文下</span></div>
<div class="cap clip" id="cap-57" data-start="129.076" data-duration="2.978" data-track-index="0"><span>每百万输入和输出 token 分别是 12 和 60 美元</span></div>
<div class="cap clip" id="cap-58" data-start="132.754" data-duration="1.8" data-track-index="0"><span>Claude 进入了 Google 文档</span></div>
<div class="cap clip" id="cap-59" data-start="134.554" data-duration="3.06" data-track-index="0"><span>表格和幻灯片，可以在侧边栏里直接改文档</span></div>
<div class="cap clip" id="cap-60" data-start="137.614" data-duration="0.768" data-track-index="0"><span>写公式</span></div>
<div class="cap clip" id="cap-61" data-start="138.552" data-duration="2.06" data-track-index="0"><span>Meta 和 Sierra 联合 Shopify</span></div>
<div class="cap clip" id="cap-62" data-start="140.612" data-duration="0.96" data-track-index="0"><span>Stripe 等公司</span></div>
<div class="cap clip" id="cap-63" data-start="141.572" data-duration="1.82" data-track-index="0"><span>起草了 Personal Agent Protocol</span></div>
<div class="cap clip" id="cap-64" data-start="143.392" data-duration="1.68" data-track-index="0"><span>规定个人 Agent 怎么认证</span></div>
<div class="cap clip" id="cap-65" data-start="145.072" data-duration="1.355" data-track-index="0"><span>怎么跟企业网站打交道</span></div>
<div class="cap clip" id="cap-66" data-start="146.597" data-duration="2.479" data-track-index="0"><span>OpenAI 为了满足欧盟 AI 法案</span></div>
<div class="cap clip" id="cap-67" data-start="149.076" data-duration="3.261" data-track-index="0"><span>会给欧盟区 ChatGPT 和 Codex 的输出加隐形水印</span></div>
<div class="cap clip" id="cap-68" data-start="152.337" data-duration="1.54" data-track-index="0"><span>不过替换 25% 的词</span></div>
<div class="cap clip" id="cap-69" data-start="153.877" data-duration="1.635" data-track-index="0"><span>检出率就掉到 17%</span></div>
<div class="cap clip" id="cap-70" data-start="156.212" data-duration="1.92" data-track-index="0"><span>接下来是本期精选</span></div>
<div class="cap clip" id="cap-71" data-start="158.132" data-duration="1.494" data-track-index="0"><span>先看一个对照实验</span></div>
<div class="cap clip" id="cap-72" data-start="159.796" data-duration="2.92" data-track-index="0"><span>Vals 用 GPT-6 Sol 和 Claude Opus 5.5</span></div>
<div class="cap clip" id="cap-73" data-start="162.716" data-duration="1.52" data-track-index="0"><span>在 50 个全栈 Web 应用上</span></div>
<div class="cap clip" id="cap-74" data-start="164.236" data-duration="1.803" data-track-index="0"><span>分别跑单 Agent 和 Agent 团队</span></div>
<div class="cap clip" id="cap-75" data-start="166.209" data-duration="0.76" data-track-index="0"><span>结果</span></div>
<div class="cap clip" id="cap-76" data-start="166.969" data-duration="2.78" data-track-index="0"><span>团队的成本是单 Agent 的 1.8 到 5.1 倍</span></div>
<div class="cap clip" id="cap-77" data-start="169.749" data-duration="2.306" data-track-index="0"><span>四组对比里，只有一组的分数提升是显著的</span></div>
<div class="cap clip" id="cap-78" data-start="172.755" data-duration="2.815" data-track-index="0"><span>多出来的钱，主要花在了缓存输入上</span></div>
<div class="cap clip" id="cap-79" data-start="175.74" data-duration="1.74" data-track-index="0"><span>Opus 高档的团队</span></div>
<div class="cap clip" id="cap-80" data-start="177.48" data-duration="2.8" data-track-index="0"><span>每个应用要读 2.24 亿缓存 token</span></div>
<div class="cap clip" id="cap-81" data-start="180.28" data-duration="1.727" data-track-index="0"><span>单 Agent 只读 5500 万</span></div>
<div class="cap clip" id="cap-82" data-start="182.177" data-duration="2.32" data-track-index="0"><span>所以，别默认开多 Agent</span></div>
<div class="cap clip" id="cap-83" data-start="184.497" data-duration="2.48" data-track-index="0"><span>先按每个任务记账，只有子任务真能并行</span></div>
<div class="cap clip" id="cap-84" data-start="186.977" data-duration="1.213" data-track-index="0"><span>团队才可能划算</span></div>
<div class="cap clip" id="cap-85" data-start="188.89" data-duration="0.72" data-track-index="0"><span>同一周</span></div>
<div class="cap clip" id="cap-86" data-start="189.61" data-duration="2.16" data-track-index="0"><span>Anthropic 也在推多 Agent</span></div>
<div class="cap clip" id="cap-87" data-start="191.77" data-duration="1.282" data-track-index="0"><span>Claude 的动态工作流</span></div>
<div class="cap clip" id="cap-88" data-start="193.222" data-duration="3.12" data-track-index="0"><span>主 Agent 先做计划，再写一段编排程序</span></div>
<div class="cap clip" id="cap-89" data-start="196.342" data-duration="2.19" data-track-index="0"><span>去启动子 Agent、收集结果</span></div>
<div class="cap clip" id="cap-90" data-start="198.702" data-duration="2.16" data-track-index="0"><span>但模型运行时并不知道预算</span></div>
<div class="cap clip" id="cap-91" data-start="200.862" data-duration="2.4" data-track-index="0"><span>会话预算得你自己设，演讲者也承认</span></div>
<div class="cap clip" id="cap-92" data-start="203.262" data-duration="1.337" data-track-index="0"><span>它比单 Agent 贵得多</span></div>
<div class="cap clip" id="cap-93" data-start="205.299" data-duration="2.812" data-track-index="0"><span>第二篇，就是卷首里提到的那个实验</span></div>
<div class="cap clip" id="cap-94" data-start="208.281" data-duration="2.68" data-track-index="0"><span>作者在 360 个 SOP-Bench 用例上</span></div>
<div class="cap clip" id="cap-95" data-start="210.961" data-duration="2" data-track-index="0"><span>把步骤是否完成交给 Jev 判断</span></div>
<div class="cap clip" id="cap-96" data-start="212.961" data-duration="2.227" data-track-index="0"><span>两个概率都过 0.8，才跳过主模型</span></div>
<div class="cap clip" id="cap-97" data-start="215.358" data-duration="3.94" data-track-index="0"><span>主模型调用从 2537 次降到 1785 次</span></div>
<div class="cap clip" id="cap-98" data-start="219.298" data-duration="2.499" data-track-index="0"><span>成本从 6.41 美元降到 4.70 美元</span></div>
<div class="cap clip" id="cap-99" data-start="221.967" data-duration="1.68" data-track-index="0"><span>不过，如果只开完成检查</span></div>
<div class="cap clip" id="cap-100" data-start="223.647" data-duration="2.6" data-track-index="0"><span>正确数会从 357 掉到 356</span></div>
<div class="cap clip" id="cap-101" data-start="226.247" data-duration="2.705" data-track-index="0"><span>只省调用、却掉了正确率，不算成功</span></div>
<div class="cap clip" id="cap-102" data-start="229.652" data-duration="2.758" data-track-index="0"><span>第三篇，讲推测解码为什么快</span></div>
<div class="cap clip" id="cap-103" data-start="232.58" data-duration="2.4" data-track-index="0"><span>很多人以为它少做了计算，其实</span></div>
<div class="cap clip" id="cap-104" data-start="234.98" data-duration="1.411" data-track-index="0"><span>总计算量反而更多</span></div>
<div class="cap clip" id="cap-105" data-start="237.091" data-duration="3.04" data-track-index="0"><span>关键在于：单个序列逐个 token 解码时</span></div>
<div class="cap clip" id="cap-106" data-start="240.131" data-duration="2.777" data-track-index="0"><span>瓶颈在访存，GPU 的算力大量闲着</span></div>
<div class="cap clip" id="cap-107" data-start="243.078" data-duration="2.58" data-track-index="0"><span>推测解码，就是用这些闲置的算力</span></div>
<div class="cap clip" id="cap-108" data-start="245.658" data-duration="1.94" data-track-index="0"><span>一次验证多个草稿 token</span></div>
<div class="cap clip" id="cap-109" data-start="247.768" data-duration="3.448" data-track-index="0"><span>但并发一高、算力吃满，它反而会拖慢所有序列</span></div>
<div class="cap clip" id="cap-110" data-start="251.686" data-duration="2.08" data-track-index="0"><span>所以，交互式的编程助手值得开</span></div>
<div class="cap clip" id="cap-111" data-start="253.766" data-duration="2.502" data-track-index="0"><span>高并发的批处理，先压测再决定</span></div>
<div class="cap clip" id="cap-112" data-start="257.208" data-duration="2.569" data-track-index="0"><span>第四篇，Devin 加上了记忆和做梦机制</span></div>
<div class="cap clip" id="cap-113" data-start="259.947" data-duration="1.76" data-track-index="0"><span>记忆就存在一个 Git 仓库里</span></div>
<div class="cap clip" id="cap-114" data-start="261.707" data-duration="1.94" data-track-index="0"><span>用 MEMORY.md 做索引</span></div>
<div class="cap clip" id="cap-115" data-start="263.647" data-duration="1.18" data-track-index="0"><span>Agent 按需检索</span></div>
<div class="cap clip" id="cap-116" data-start="264.827" data-duration="1.711" data-track-index="0"><span>不把全部记忆塞进提示词</span></div>
<div class="cap clip" id="cap-117" data-start="266.708" data-duration="2.08" data-track-index="0"><span>多个会话同时写入时</span></div>
<div class="cap clip" id="cap-118" data-start="268.788" data-duration="3.547" data-track-index="0"><span>用版本检查拒绝过期的写入，冲突交给人来处理</span></div>
<div class="cap clip" id="cap-119" data-start="273.035" data-duration="1.64" data-track-index="0"><span>自己做 Agent 记忆的话</span></div>
<div class="cap clip" id="cap-120" data-start="274.675" data-duration="1.92" data-track-index="0"><span>Markdown 加 Git 加索引文件</span></div>
<div class="cap clip" id="cap-121" data-start="276.595" data-duration="1.323" data-track-index="0"><span>这套可以直接照搬</span></div>
<div class="cap clip" id="cap-122" data-start="278.618" data-duration="2.46" data-track-index="0"><span>第五篇来自 htmx 的作者</span></div>
<div class="cap clip" id="cap-123" data-start="281.078" data-duration="0.8" data-track-index="0"><span>他观察到</span></div>
<div class="cap clip" id="cap-124" data-start="281.878" data-duration="1.88" data-track-index="0"><span>重度使用编程 Agent 的公司里</span></div>
