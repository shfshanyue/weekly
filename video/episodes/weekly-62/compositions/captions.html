<div id="captions-root" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="491.665">
<div class="cap clip" id="cap-0" data-start="0.7" data-duration="1.48" data-track-index="0"><span>大家好，我是山月</span></div>
<div class="cap clip" id="cap-1" data-start="2.18" data-duration="3.29" data-track-index="0"><span>这里是开发者 AI 周刊第 62 期</span></div>
<div class="cap clip" id="cap-2" data-start="5.64" data-duration="3.18" data-track-index="0"><span>这一期的卷首，想聊一件事</span></div>
<div class="cap clip" id="cap-3" data-start="8.82" data-duration="2.344" data-track-index="0"><span>别让大模型做是非题</span></div>
<div class="cap clip" id="cap-4" data-start="11.334" data-duration="3.096" data-track-index="0"><span>顺带，也算一算 Agent 的成本账</span></div>
<div class="cap clip" id="cap-5" data-start="15.13" data-duration="1.08" data-track-index="0"><span>上个月</span></div>
<div class="cap clip" id="cap-6" data-start="16.21" data-duration="3.929" data-track-index="0"><span>TypeSafe 发布了一个叫 Jev 的小模型</span></div>
<div class="cap clip" id="cap-7" data-start="20.309" data-duration="3.2" data-track-index="0"><span>三周之后，它变成了一个品类</span></div>
<div class="cap clip" id="cap-8" data-start="23.509" data-duration="2.88" data-track-index="0"><span>OpenAI 上线 Decisions API</span></div>
<div class="cap clip" id="cap-9" data-start="26.389" data-duration="1.5" data-track-index="0"><span>微软、Cloudflare</span></div>
<div class="cap clip" id="cap-10" data-start="27.889" data-duration="0.96" data-track-index="0"><span>Liquid AI</span></div>
<div class="cap clip" id="cap-11" data-start="28.849" data-duration="2.088" data-track-index="0"><span>Perplexity 也纷纷跟进</span></div>
<div class="cap clip" id="cap-12" data-start="31.637" data-duration="3.893" data-track-index="0"><span>决策模型不生成文字，只回答三类问题</span></div>
<div class="cap clip" id="cap-13" data-start="35.7" data-duration="4.02" data-track-index="0"><span>一句话为真的概率，在固定选项里选哪一个</span></div>
<div class="cap clip" id="cap-14" data-start="39.72" data-duration="2.105" data-track-index="0"><span>按评分标准打几分</span></div>
<div class="cap clip" id="cap-15" data-start="42.525" data-duration="3.06" data-track-index="0"><span>它一次前向计算就给出结果</span></div>
<div class="cap clip" id="cap-16" data-start="45.585" data-duration="2.826" data-track-index="0"><span>没有输出 token，所以又快又便宜</span></div>
<div class="cap clip" id="cap-17" data-start="48.581" data-duration="2.6" data-track-index="0"><span>OpenAI 的 Decisions API</span></div>
<div class="cap clip" id="cap-18" data-start="51.181" data-duration="2.58" data-track-index="0"><span>每百万输入 token 只要 0.1 美元</span></div>
<div class="cap clip" id="cap-19" data-start="53.761" data-duration="1.504" data-track-index="0"><span>而且不收输出费</span></div>
<div class="cap clip" id="cap-20" data-start="55.965" data-duration="3.574" data-track-index="0"><span>它真正改变的，是 Agent 的结构</span></div>
<div class="cap clip" id="cap-21" data-start="59.709" data-duration="3.3" data-track-index="0"><span>一个 Agent 的大量调用，其实不是在写</span></div>
<div class="cap clip" id="cap-22" data-start="63.009" data-duration="1.31" data-track-index="0"><span>而是在判</span></div>
<div class="cap clip" id="cap-23" data-start="64.489" data-duration="2.02" data-track-index="0"><span>这一步做完了吗？</span></div>
<div class="cap clip" id="cap-24" data-start="66.509" data-duration="1.48" data-track-index="0"><span>证据够不够？</span></div>
<div class="cap clip" id="cap-25" data-start="67.989" data-duration="2.224" data-track-index="0"><span>这封邮件属于哪个意图？</span></div>
<div class="cap clip" id="cap-26" data-start="70.383" data-duration="4.211" data-track-index="0"><span>过去，这些判断都交给主模型，多跑一轮</span></div>
<div class="cap clip" id="cap-27" data-start="75.294" data-duration="3.34" data-track-index="0"><span>更好的做法，是把判断拆出来</span></div>
<div class="cap clip" id="cap-28" data-start="78.634" data-duration="2.227" data-track-index="0"><span>交给决策模型当闸门</span></div>
<div class="cap clip" id="cap-29" data-start="81.031" data-duration="4.451" data-track-index="0"><span>置信度够高，就直接放行，不够，就退回大模型</span></div>
<div class="cap clip" id="cap-30" data-start="85.652" data-duration="3.28" data-track-index="0"><span>有人在 360 个用例上这样做</span></div>
<div class="cap clip" id="cap-31" data-start="88.932" data-duration="2.526" data-track-index="0"><span>主模型调用少了近三成</span></div>
<div class="cap clip" id="cap-32" data-start="92.158" data-duration="2.219" data-track-index="0"><span>但别急着全面替换</span></div>
<div class="cap clip" id="cap-33" data-start="94.547" data-duration="2.993" data-track-index="0"><span>有人用它预测一枚 70% 正面的偏币</span></div>
<div class="cap clip" id="cap-34" data-start="97.54" data-duration="3.372" data-track-index="0"><span>1000 次里，98% 都选了正面</span></div>
<div class="cap clip" id="cap-35" data-start="101.082" data-duration="4.531" data-track-index="0"><span>也就是说，它给的概率，并不等于真实的概率</span></div>
<div class="cap clip" id="cap-36" data-start="106.313" data-duration="2.92" data-track-index="0"><span>Simon Willison 也提醒</span></div>
<div class="cap clip" id="cap-37" data-start="109.233" data-duration="3.481" data-track-index="0"><span>你只拿到一个浮点数，拿不到理由</span></div>
<div class="cap clip" id="cap-38" data-start="112.884" data-duration="4.929" data-track-index="0"><span>给求职者排序这类高风险的场景，尤其要小心</span></div>
<div class="cap clip" id="cap-39" data-start="118.513" data-duration="1.662" data-track-index="0"><span>所以我的判断是</span></div>
<div class="cap clip" id="cap-40" data-start="120.345" data-duration="3.26" data-track-index="0"><span>决策模型适合当 Agent 里的闸门</span></div>
<div class="cap clip" id="cap-41" data-start="123.605" data-duration="1.43" data-track-index="0"><span>不适合当法官</span></div>
<div class="cap clip" id="cap-42" data-start="125.205" data-duration="4.5" data-track-index="0"><span>从有明确选项、有兜底、错了能回滚的判断开始</span></div>
<div class="cap clip" id="cap-43" data-start="129.705" data-duration="2.902" data-track-index="0"><span>阈值，用你自己的标注集测出来</span></div>
<div class="cap clip" id="cap-44" data-start="133.307" data-duration="2.697" data-track-index="0"><span>接下来，过一遍本周快讯</span></div>
<div class="cap clip" id="cap-45" data-start="136.174" data-duration="3.06" data-track-index="0"><span>Claude Code Projects 开始公开测试</span></div>
<div class="cap clip" id="cap-46" data-start="139.234" data-duration="3.5" data-track-index="0"><span>一个 Project 可以协调多个并行的云端线程</span></div>
<div class="cap clip" id="cap-47" data-start="142.734" data-duration="2.199" data-track-index="0"><span>共享同一个仓库和指令</span></div>
<div class="cap clip" id="cap-48" data-start="145.103" data-duration="4.36" data-track-index="0"><span>Cursor 现在能用手机遥控电脑上的本地 Agent</span></div>
<div class="cap clip" id="cap-49" data-start="149.463" data-duration="2.324" data-track-index="0"><span>Agent 仍然在你自己的电脑上执行</span></div>
<div class="cap clip" id="cap-50" data-start="151.957" data-duration="2.76" data-track-index="0"><span>Mistral Large 4 公开预览</span></div>
<div class="cap clip" id="cap-51" data-start="154.717" data-duration="2.78" data-track-index="0"><span>1T 总参数，52B 激活</span></div>
<div class="cap clip" id="cap-52" data-start="157.497" data-duration="1.304" data-track-index="0"><span>权重计划月底发布</span></div>
<div class="cap clip" id="cap-53" data-start="158.971" data-duration="1.4" data-track-index="0"><span>微软宣布</span></div>
<div class="cap clip" id="cap-54" data-start="160.371" data-duration="4.167" data-track-index="0"><span>Windows 上的 Agent 执行容器 MXC 正式可用</span></div>
<div class="cap clip" id="cap-55" data-start="164.708" data-duration="4.74" data-track-index="0"><span>OpenAI 给 GPT-6.1 Sol 加了 ultrafast 档位</span></div>
<div class="cap clip" id="cap-56" data-start="169.448" data-duration="1.34" data-track-index="0"><span>短上下文下</span></div>
<div class="cap clip" id="cap-57" data-start="170.788" data-duration="4.002" data-track-index="0"><span>每百万输入和输出 token 分别是 12 和 60 美元</span></div>
<div class="cap clip" id="cap-58" data-start="175.49" data-duration="2.3" data-track-index="0"><span>Claude 进入了 Google 文档</span></div>
<div class="cap clip" id="cap-59" data-start="177.79" data-duration="3.74" data-track-index="0"><span>表格和幻灯片，可以在侧边栏里直接改文档</span></div>
<div class="cap clip" id="cap-60" data-start="181.53" data-duration="0.644" data-track-index="0"><span>写公式</span></div>
<div class="cap clip" id="cap-61" data-start="182.344" data-duration="2.76" data-track-index="0"><span>Meta 和 Sierra 联合 Shopify</span></div>
<div class="cap clip" id="cap-62" data-start="185.104" data-duration="1.52" data-track-index="0"><span>Stripe 等公司</span></div>
<div class="cap clip" id="cap-63" data-start="186.624" data-duration="2.7" data-track-index="0"><span>起草了 Personal Agent Protocol</span></div>
<div class="cap clip" id="cap-64" data-start="189.324" data-duration="2.64" data-track-index="0"><span>规定个人 Agent 怎么认证</span></div>
<div class="cap clip" id="cap-65" data-start="191.964" data-duration="1.774" data-track-index="0"><span>怎么跟企业网站打交道</span></div>
<div class="cap clip" id="cap-66" data-start="193.908" data-duration="2.84" data-track-index="0"><span>OpenAI 为了满足欧盟 AI 法案</span></div>
<div class="cap clip" id="cap-67" data-start="196.748" data-duration="4.24" data-track-index="0"><span>会给欧盟区 ChatGPT 和 Codex 的输出加隐形水印</span></div>
<div class="cap clip" id="cap-68" data-start="200.988" data-duration="1.94" data-track-index="0"><span>不过替换 25% 的词</span></div>
<div class="cap clip" id="cap-69" data-start="202.928" data-duration="2.018" data-track-index="0"><span>检出率就掉到 17%</span></div>
<div class="cap clip" id="cap-70" data-start="205.646" data-duration="2.12" data-track-index="0"><span>接下来是本期精选</span></div>
<div class="cap clip" id="cap-71" data-start="207.766" data-duration="2.12" data-track-index="0"><span>先看一个对照实验</span></div>
<div class="cap clip" id="cap-72" data-start="210.056" data-duration="5.18" data-track-index="0"><span>Vals 用 GPT-6 Sol 和 Claude Opus 5.5</span></div>
<div class="cap clip" id="cap-73" data-start="215.236" data-duration="2.28" data-track-index="0"><span>在 50 个全栈 Web 应用上</span></div>
<div class="cap clip" id="cap-74" data-start="217.516" data-duration="2.702" data-track-index="0"><span>分别跑单 Agent 和 Agent 团队</span></div>
<div class="cap clip" id="cap-75" data-start="220.388" data-duration="0.92" data-track-index="0"><span>结果</span></div>
<div class="cap clip" id="cap-76" data-start="221.308" data-duration="3.58" data-track-index="0"><span>团队的成本是单 Agent 的 1.8 到 5.1 倍</span></div>
<div class="cap clip" id="cap-77" data-start="224.888" data-duration="3.141" data-track-index="0"><span>四组对比里，只有一组的分数提升是显著的</span></div>
<div class="cap clip" id="cap-78" data-start="228.729" data-duration="3.733" data-track-index="0"><span>多出来的钱，主要花在了缓存输入上</span></div>
<div class="cap clip" id="cap-79" data-start="232.632" data-duration="2.28" data-track-index="0"><span>Opus 高档的团队</span></div>
<div class="cap clip" id="cap-80" data-start="234.912" data-duration="3.72" data-track-index="0"><span>每个应用要读 2.24 亿缓存 token</span></div>
<div class="cap clip" id="cap-81" data-start="238.632" data-duration="2.36" data-track-index="0"><span>单 Agent 只读 5500 万</span></div>
<div class="cap clip" id="cap-82" data-start="241.162" data-duration="2.04" data-track-index="0"><span>所以，别默认开多 Agent</span></div>
<div class="cap clip" id="cap-83" data-start="243.202" data-duration="3.76" data-track-index="0"><span>先按每个任务记账，只有子任务真能并行</span></div>
<div class="cap clip" id="cap-84" data-start="246.962" data-duration="1.256" data-track-index="0"><span>团队才可能划算</span></div>
<div class="cap clip" id="cap-85" data-start="248.918" data-duration="1.1" data-track-index="0"><span>同一周</span></div>
<div class="cap clip" id="cap-86" data-start="250.018" data-duration="2.96" data-track-index="0"><span>Anthropic 也在推多 Agent</span></div>
<div class="cap clip" id="cap-87" data-start="252.978" data-duration="2.102" data-track-index="0"><span>Claude 的动态工作流</span></div>
<div class="cap clip" id="cap-88" data-start="255.25" data-duration="3.98" data-track-index="0"><span>主 Agent 先做计划，再写一段编排程序</span></div>
<div class="cap clip" id="cap-89" data-start="259.23" data-duration="2.599" data-track-index="0"><span>去启动子 Agent、收集结果</span></div>
<div class="cap clip" id="cap-90" data-start="261.999" data-duration="2.72" data-track-index="0"><span>但模型运行时并不知道预算</span></div>
<div class="cap clip" id="cap-91" data-start="264.719" data-duration="3.06" data-track-index="0"><span>会话预算得你自己设，演讲者也承认</span></div>
<div class="cap clip" id="cap-92" data-start="267.779" data-duration="1.622" data-track-index="0"><span>它比单 Agent 贵得多</span></div>
<div class="cap clip" id="cap-93" data-start="270.101" data-duration="3.494" data-track-index="0"><span>第二篇，就是卷首里提到的那个实验</span></div>
<div class="cap clip" id="cap-94" data-start="273.765" data-duration="3.76" data-track-index="0"><span>作者在 360 个 SOP-Bench 用例上</span></div>
<div class="cap clip" id="cap-95" data-start="277.525" data-duration="2.6" data-track-index="0"><span>把步骤是否完成交给 Jev 判断</span></div>
<div class="cap clip" id="cap-96" data-start="280.125" data-duration="3.277" data-track-index="0"><span>两个概率都过 0.8，才跳过主模型</span></div>
<div class="cap clip" id="cap-97" data-start="283.572" data-duration="4.76" data-track-index="0"><span>主模型调用从 2537 次降到 1785 次</span></div>
<div class="cap clip" id="cap-98" data-start="288.332" data-duration="2.962" data-track-index="0"><span>成本从 6.41 美元降到 4.70 美元</span></div>
<div class="cap clip" id="cap-99" data-start="291.464" data-duration="2.64" data-track-index="0"><span>不过，如果只开完成检查</span></div>
<div class="cap clip" id="cap-100" data-start="294.104" data-duration="3.52" data-track-index="0"><span>正确数会从 357 掉到 356</span></div>
<div class="cap clip" id="cap-101" data-start="297.624" data-duration="3.828" data-track-index="0"><span>只省调用、却掉了正确率，不算成功</span></div>
<div class="cap clip" id="cap-102" data-start="302.152" data-duration="3.335" data-track-index="0"><span>第三篇，讲推测解码为什么快</span></div>
<div class="cap clip" id="cap-103" data-start="305.657" data-duration="3.36" data-track-index="0"><span>很多人以为它少做了计算，其实</span></div>
<div class="cap clip" id="cap-104" data-start="309.017" data-duration="1.707" data-track-index="0"><span>总计算量反而更多</span></div>
<div class="cap clip" id="cap-105" data-start="311.424" data-duration="4.38" data-track-index="0"><span>关键在于：单个序列逐个 token 解码时</span></div>
<div class="cap clip" id="cap-106" data-start="315.804" data-duration="3.618" data-track-index="0"><span>瓶颈在访存，GPU 的算力大量闲着</span></div>
<div class="cap clip" id="cap-107" data-start="319.592" data-duration="3.94" data-track-index="0"><span>推测解码，就是用这些闲置的算力</span></div>
<div class="cap clip" id="cap-108" data-start="323.532" data-duration="2.824" data-track-index="0"><span>一次验证多个草稿 token</span></div>
<div class="cap clip" id="cap-109" data-start="326.526" data-duration="5.328" data-track-index="0"><span>但并发一高、算力吃满，它反而会拖慢所有序列</span></div>
<div class="cap clip" id="cap-110" data-start="332.024" data-duration="3.32" data-track-index="0"><span>所以，交互式的编程助手值得开</span></div>
<div class="cap clip" id="cap-111" data-start="335.344" data-duration="3.364" data-track-index="0"><span>高并发的批处理，先压测再决定</span></div>
<div class="cap clip" id="cap-112" data-start="339.408" data-duration="3.875" data-track-index="0"><span>第四篇，Devin 加上了记忆和做梦机制</span></div>
<div class="cap clip" id="cap-113" data-start="343.453" data-duration="2.58" data-track-index="0"><span>记忆就存在一个 Git 仓库里</span></div>
<div class="cap clip" id="cap-114" data-start="346.033" data-duration="2.22" data-track-index="0"><span>用 MEMORY.md 做索引</span></div>
<div class="cap clip" id="cap-115" data-start="348.253" data-duration="1.38" data-track-index="0"><span>Agent 按需检索</span></div>
<div class="cap clip" id="cap-116" data-start="349.633" data-duration="2.15" data-track-index="0"><span>不把全部记忆塞进提示词</span></div>
<div class="cap clip" id="cap-117" data-start="351.953" data-duration="2.64" data-track-index="0"><span>多个会话同时写入时</span></div>
<div class="cap clip" id="cap-118" data-start="354.593" data-duration="4.124" data-track-index="0"><span>用版本检查拒绝过期的写入，冲突交给人来处理</span></div>
<div class="cap clip" id="cap-119" data-start="359.417" data-duration="2.16" data-track-index="0"><span>自己做 Agent 记忆的话</span></div>
<div class="cap clip" id="cap-120" data-start="361.577" data-duration="2.44" data-track-index="0"><span>Markdown 加 Git 加索引文件</span></div>
<div class="cap clip" id="cap-121" data-start="364.017" data-duration="2.004" data-track-index="0"><span>这套可以直接照搬</span></div>
<div class="cap clip" id="cap-122" data-start="366.721" data-duration="4.44" data-track-index="0"><span>第五篇来自 htmx 的作者</span></div>
<div class="cap clip" id="cap-123" data-start="371.161" data-duration="1.14" data-track-index="0"><span>他观察到</span></div>
<div class="cap clip" id="cap-124" data-start="372.301" data-duration="2.76" data-track-index="0"><span>重度使用编程 Agent 的公司里</span></div>
