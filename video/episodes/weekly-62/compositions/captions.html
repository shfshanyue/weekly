<div id="captions-root" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="496.854">
<div class="cap clip" id="cap-0" data-start="1.14" data-duration="1.36" data-track-index="0"><span>大家好，我是山月</span></div>
<div class="cap clip" id="cap-1" data-start="2.5" data-duration="2.55" data-track-index="0"><span>这里是开发者 AI 周刊第 62 期</span></div>
<div class="cap clip" id="cap-2" data-start="5.22" data-duration="2.8" data-track-index="0"><span>这一期的卷首，想聊一件事</span></div>
<div class="cap clip" id="cap-3" data-start="8.02" data-duration="1.85" data-track-index="0"><span>别让大模型做是非题</span></div>
<div class="cap clip" id="cap-4" data-start="10.04" data-duration="3.417" data-track-index="0"><span>顺带，也算一算 Agent 的成本账</span></div>
<div class="cap clip" id="cap-5" data-start="14.157" data-duration="1" data-track-index="0"><span>上个月</span></div>
<div class="cap clip" id="cap-6" data-start="15.157" data-duration="3.083" data-track-index="0"><span>TypeSafe 发布了一个叫 Jev 的小模型</span></div>
<div class="cap clip" id="cap-7" data-start="18.41" data-duration="3.48" data-track-index="0"><span>三周之后，它变成了一个品类</span></div>
<div class="cap clip" id="cap-8" data-start="21.89" data-duration="2.64" data-track-index="0"><span>OpenAI 上线 Decisions API</span></div>
<div class="cap clip" id="cap-9" data-start="24.53" data-duration="1.96" data-track-index="0"><span>微软、Cloudflare</span></div>
<div class="cap clip" id="cap-10" data-start="26.49" data-duration="0.86" data-track-index="0"><span>Liquid AI</span></div>
<div class="cap clip" id="cap-11" data-start="27.35" data-duration="2.11" data-track-index="0"><span>Perplexity 也纷纷跟进</span></div>
<div class="cap clip" id="cap-12" data-start="30.16" data-duration="3.483" data-track-index="0"><span>决策模型不生成文字，只回答三类问题</span></div>
<div class="cap clip" id="cap-13" data-start="33.813" data-duration="4.12" data-track-index="0"><span>一句话为真的概率，在固定选项里选哪一个</span></div>
<div class="cap clip" id="cap-14" data-start="37.933" data-duration="1.63" data-track-index="0"><span>按评分标准打几分</span></div>
<div class="cap clip" id="cap-15" data-start="40.263" data-duration="2.76" data-track-index="0"><span>它一次前向计算就给出结果</span></div>
<div class="cap clip" id="cap-16" data-start="43.023" data-duration="2.657" data-track-index="0"><span>没有输出 token，所以又快又便宜</span></div>
<div class="cap clip" id="cap-17" data-start="45.85" data-duration="2.78" data-track-index="0"><span>OpenAI 的 Decisions API</span></div>
<div class="cap clip" id="cap-18" data-start="48.63" data-duration="3.04" data-track-index="0"><span>每百万输入 token 只要 0.1 美元</span></div>
<div class="cap clip" id="cap-19" data-start="51.67" data-duration="1.73" data-track-index="0"><span>而且不收输出费</span></div>
<div class="cap clip" id="cap-20" data-start="54.1" data-duration="3.15" data-track-index="0"><span>它真正改变的，是 Agent 的结构</span></div>
<div class="cap clip" id="cap-21" data-start="57.42" data-duration="4.4" data-track-index="0"><span>一个 Agent 的大量调用，其实不是在写</span></div>
<div class="cap clip" id="cap-22" data-start="61.82" data-duration="0.95" data-track-index="0"><span>而是在判</span></div>
<div class="cap clip" id="cap-23" data-start="62.94" data-duration="1.82" data-track-index="0"><span>这一步做完了吗？</span></div>
<div class="cap clip" id="cap-24" data-start="64.76" data-duration="1.5" data-track-index="0"><span>证据够不够？</span></div>
<div class="cap clip" id="cap-25" data-start="66.26" data-duration="1.697" data-track-index="0"><span>这封邮件属于哪个意图？</span></div>
<div class="cap clip" id="cap-26" data-start="68.127" data-duration="4.35" data-track-index="0"><span>过去，这些判断都交给主模型，多跑一轮</span></div>
<div class="cap clip" id="cap-27" data-start="73.177" data-duration="2.88" data-track-index="0"><span>更好的做法，是把判断拆出来</span></div>
<div class="cap clip" id="cap-28" data-start="76.057" data-duration="2.27" data-track-index="0"><span>交给决策模型当闸门</span></div>
<div class="cap clip" id="cap-29" data-start="78.497" data-duration="5.883" data-track-index="0"><span>置信度够高，就直接放行，不够，就退回大模型</span></div>
<div class="cap clip" id="cap-30" data-start="84.55" data-duration="3.22" data-track-index="0"><span>有人在 360 个用例上这样做</span></div>
<div class="cap clip" id="cap-31" data-start="87.77" data-duration="2.33" data-track-index="0"><span>主模型调用少了近三成</span></div>
<div class="cap clip" id="cap-32" data-start="90.8" data-duration="1.817" data-track-index="0"><span>但别急着全面替换</span></div>
<div class="cap clip" id="cap-33" data-start="92.787" data-duration="2.9" data-track-index="0"><span>有人用它预测一枚 70% 正面的偏币</span></div>
<div class="cap clip" id="cap-34" data-start="95.687" data-duration="3.25" data-track-index="0"><span>1000 次里，98% 都选了正面</span></div>
<div class="cap clip" id="cap-35" data-start="99.107" data-duration="3.816" data-track-index="0"><span>也就是说，它给的概率，并不等于真实的概率</span></div>
<div class="cap clip" id="cap-36" data-start="103.623" data-duration="2.52" data-track-index="0"><span>Simon Willison 也提醒</span></div>
<div class="cap clip" id="cap-37" data-start="106.143" data-duration="2.663" data-track-index="0"><span>你只拿到一个浮点数，拿不到理由</span></div>
<div class="cap clip" id="cap-38" data-start="108.976" data-duration="3.95" data-track-index="0"><span>给求职者排序这类高风险的场景，尤其要小心</span></div>
<div class="cap clip" id="cap-39" data-start="113.626" data-duration="1.817" data-track-index="0"><span>所以我的判断是</span></div>
<div class="cap clip" id="cap-40" data-start="115.613" data-duration="2.96" data-track-index="0"><span>决策模型适合当 Agent 里的闸门</span></div>
<div class="cap clip" id="cap-41" data-start="118.573" data-duration="1.256" data-track-index="0"><span>不适合当法官</span></div>
<div class="cap clip" id="cap-42" data-start="119.999" data-duration="4.3" data-track-index="0"><span>从有明确选项、有兜底、错了能回滚的判断开始</span></div>
<div class="cap clip" id="cap-43" data-start="124.299" data-duration="3.917" data-track-index="0"><span>阈值，用你自己的标注集测出来</span></div>
<div class="cap clip" id="cap-44" data-start="128.916" data-duration="2.75" data-track-index="0"><span>接下来，过一遍本周快讯</span></div>
<div class="cap clip" id="cap-45" data-start="131.836" data-duration="2.96" data-track-index="0"><span>Claude Code Projects 开始公开测试</span></div>
<div class="cap clip" id="cap-46" data-start="134.796" data-duration="3.5" data-track-index="0"><span>一个 Project 可以协调多个并行的云端线程</span></div>
<div class="cap clip" id="cap-47" data-start="138.296" data-duration="3.023" data-track-index="0"><span>共享同一个仓库和指令</span></div>
<div class="cap clip" id="cap-48" data-start="141.489" data-duration="4.28" data-track-index="0"><span>Cursor 现在能用手机遥控电脑上的本地 Agent</span></div>
<div class="cap clip" id="cap-49" data-start="145.769" data-duration="2.604" data-track-index="0"><span>Agent 仍然在你自己的电脑上执行</span></div>
<div class="cap clip" id="cap-50" data-start="148.543" data-duration="3.36" data-track-index="0"><span>Mistral Large 4 公开预览</span></div>
<div class="cap clip" id="cap-51" data-start="151.903" data-duration="3.18" data-track-index="0"><span>1T 总参数，52B 激活</span></div>
<div class="cap clip" id="cap-52" data-start="155.083" data-duration="2.01" data-track-index="0"><span>权重计划月底发布</span></div>
<div class="cap clip" id="cap-53" data-start="157.263" data-duration="1.52" data-track-index="0"><span>微软宣布</span></div>
<div class="cap clip" id="cap-54" data-start="158.783" data-duration="3.83" data-track-index="0"><span>Windows 上的 Agent 执行容器 MXC 正式可用</span></div>
<div class="cap clip" id="cap-55" data-start="162.783" data-duration="4.22" data-track-index="0"><span>OpenAI 给 GPT-6.1 Sol 加了 ultrafast 档位</span></div>
<div class="cap clip" id="cap-56" data-start="167.003" data-duration="1.36" data-track-index="0"><span>短上下文下</span></div>
<div class="cap clip" id="cap-57" data-start="168.363" data-duration="3.836" data-track-index="0"><span>每百万输入和输出 token 分别是 12 和 60 美元</span></div>
<div class="cap clip" id="cap-58" data-start="172.899" data-duration="2.16" data-track-index="0"><span>Claude 进入了 Google 文档</span></div>
<div class="cap clip" id="cap-59" data-start="175.059" data-duration="3.62" data-track-index="0"><span>表格和幻灯片，可以在侧边栏里直接改文档</span></div>
<div class="cap clip" id="cap-60" data-start="178.679" data-duration="1.037" data-track-index="0"><span>写公式</span></div>
<div class="cap clip" id="cap-61" data-start="179.886" data-duration="2.96" data-track-index="0"><span>Meta 和 Sierra 联合 Shopify</span></div>
<div class="cap clip" id="cap-62" data-start="182.846" data-duration="0.98" data-track-index="0"><span>Stripe 等公司</span></div>
<div class="cap clip" id="cap-63" data-start="183.826" data-duration="2.48" data-track-index="0"><span>起草了 Personal Agent Protocol</span></div>
<div class="cap clip" id="cap-64" data-start="186.306" data-duration="1.88" data-track-index="0"><span>规定个人 Agent 怎么认证</span></div>
<div class="cap clip" id="cap-65" data-start="188.186" data-duration="2.25" data-track-index="0"><span>怎么跟企业网站打交道</span></div>
<div class="cap clip" id="cap-66" data-start="190.946" data-duration="2.84" data-track-index="0"><span>OpenAI 为了满足欧盟 AI 法案</span></div>
<div class="cap clip" id="cap-67" data-start="193.786" data-duration="4.68" data-track-index="0"><span>会给欧盟区 ChatGPT 和 Codex 的输出加隐形水印</span></div>
<div class="cap clip" id="cap-68" data-start="198.466" data-duration="2.06" data-track-index="0"><span>不过替换 25% 的词</span></div>
<div class="cap clip" id="cap-69" data-start="200.526" data-duration="2.163" data-track-index="0"><span>检出率就掉到 17%</span></div>
<div class="cap clip" id="cap-70" data-start="203.389" data-duration="2.04" data-track-index="0"><span>接下来是本期精选</span></div>
<div class="cap clip" id="cap-71" data-start="205.429" data-duration="1.677" data-track-index="0"><span>先看一个对照实验</span></div>
<div class="cap clip" id="cap-72" data-start="207.276" data-duration="4.56" data-track-index="0"><span>Vals 用 GPT-6 Sol 和 Claude Opus 5.5</span></div>
<div class="cap clip" id="cap-73" data-start="211.836" data-duration="2.32" data-track-index="0"><span>在 50 个全栈 Web 应用上</span></div>
<div class="cap clip" id="cap-74" data-start="214.156" data-duration="2.536" data-track-index="0"><span>分别跑单 Agent 和 Agent 团队</span></div>
<div class="cap clip" id="cap-75" data-start="216.862" data-duration="1.06" data-track-index="0"><span>结果</span></div>
<div class="cap clip" id="cap-76" data-start="217.922" data-duration="3.78" data-track-index="0"><span>团队的成本是单 Agent 的 1.8 到 5.1 倍</span></div>
<div class="cap clip" id="cap-77" data-start="221.702" data-duration="3.577" data-track-index="0"><span>四组对比里，只有一组的分数提升是显著的</span></div>
<div class="cap clip" id="cap-78" data-start="225.979" data-duration="3.55" data-track-index="0"><span>多出来的钱，主要花在了缓存输入上</span></div>
<div class="cap clip" id="cap-79" data-start="229.699" data-duration="2.14" data-track-index="0"><span>Opus 高档的团队</span></div>
<div class="cap clip" id="cap-80" data-start="231.839" data-duration="3.46" data-track-index="0"><span>每个应用要读 2.24 亿缓存 token</span></div>
<div class="cap clip" id="cap-81" data-start="235.299" data-duration="2.683" data-track-index="0"><span>单 Agent 只读 5500 万</span></div>
<div class="cap clip" id="cap-82" data-start="238.152" data-duration="2.36" data-track-index="0"><span>所以，别默认开多 Agent</span></div>
<div class="cap clip" id="cap-83" data-start="240.512" data-duration="3.3" data-track-index="0"><span>先按每个任务记账，只有子任务真能并行</span></div>
<div class="cap clip" id="cap-84" data-start="243.812" data-duration="1.824" data-track-index="0"><span>团队才可能划算</span></div>
<div class="cap clip" id="cap-85" data-start="246.336" data-duration="1.32" data-track-index="0"><span>同一周</span></div>
<div class="cap clip" id="cap-86" data-start="247.656" data-duration="2.78" data-track-index="0"><span>Anthropic 也在推多 Agent</span></div>
<div class="cap clip" id="cap-87" data-start="250.436" data-duration="1.817" data-track-index="0"><span>Claude 的动态工作流</span></div>
<div class="cap clip" id="cap-88" data-start="252.423" data-duration="4.72" data-track-index="0"><span>主 Agent 先做计划，再写一段编排程序</span></div>
<div class="cap clip" id="cap-89" data-start="257.143" data-duration="2.563" data-track-index="0"><span>去启动子 Agent、收集结果</span></div>
<div class="cap clip" id="cap-90" data-start="259.876" data-duration="2.76" data-track-index="0"><span>但模型运行时并不知道预算</span></div>
<div class="cap clip" id="cap-91" data-start="262.636" data-duration="3.42" data-track-index="0"><span>会话预算得你自己设，演讲者也承认</span></div>
<div class="cap clip" id="cap-92" data-start="266.056" data-duration="2.17" data-track-index="0"><span>它比单 Agent 贵得多</span></div>
<div class="cap clip" id="cap-93" data-start="268.926" data-duration="3.283" data-track-index="0"><span>第二篇，就是卷首里提到的那个实验</span></div>
<div class="cap clip" id="cap-94" data-start="272.739" data-duration="3.2" data-track-index="0"><span>作者在 360 个 SOP-Bench 用例上</span></div>
<div class="cap clip" id="cap-95" data-start="275.939" data-duration="2.82" data-track-index="0"><span>把步骤是否完成交给 Jev 判断</span></div>
<div class="cap clip" id="cap-96" data-start="278.759" data-duration="3.17" data-track-index="0"><span>两个概率都过 0.8，才跳过主模型</span></div>
<div class="cap clip" id="cap-97" data-start="282.099" data-duration="5.08" data-track-index="0"><span>主模型调用从 2537 次降到 1785 次</span></div>
<div class="cap clip" id="cap-98" data-start="287.179" data-duration="3.204" data-track-index="0"><span>成本从 6.41 美元降到 4.70 美元</span></div>
<div class="cap clip" id="cap-99" data-start="290.553" data-duration="2.86" data-track-index="0"><span>不过，如果只开完成检查</span></div>
<div class="cap clip" id="cap-100" data-start="293.413" data-duration="3.4" data-track-index="0"><span>正确数会从 357 掉到 356</span></div>
<div class="cap clip" id="cap-101" data-start="296.813" data-duration="3.523" data-track-index="0"><span>只省调用、却掉了正确率，不算成功</span></div>
<div class="cap clip" id="cap-102" data-start="301.036" data-duration="3.017" data-track-index="0"><span>第三篇，讲推测解码为什么快</span></div>
<div class="cap clip" id="cap-103" data-start="304.223" data-duration="3.54" data-track-index="0"><span>很多人以为它少做了计算，其实</span></div>
<div class="cap clip" id="cap-104" data-start="307.763" data-duration="1.81" data-track-index="0"><span>总计算量反而更多</span></div>
<div class="cap clip" id="cap-105" data-start="310.273" data-duration="4.24" data-track-index="0"><span>关键在于：单个序列逐个 token 解码时</span></div>
<div class="cap clip" id="cap-106" data-start="314.513" data-duration="3.543" data-track-index="0"><span>瓶颈在访存，GPU 的算力大量闲着</span></div>
<div class="cap clip" id="cap-107" data-start="318.226" data-duration="3.42" data-track-index="0"><span>推测解码，就是用这些闲置的算力</span></div>
<div class="cap clip" id="cap-108" data-start="321.646" data-duration="1.93" data-track-index="0"><span>一次验证多个草稿 token</span></div>
<div class="cap clip" id="cap-109" data-start="323.746" data-duration="5.15" data-track-index="0"><span>但并发一高、算力吃满，它反而会拖慢所有序列</span></div>
<div class="cap clip" id="cap-110" data-start="329.066" data-duration="3.22" data-track-index="0"><span>所以，交互式的编程助手值得开</span></div>
<div class="cap clip" id="cap-111" data-start="332.286" data-duration="3.93" data-track-index="0"><span>高并发的批处理，先压测再决定</span></div>
<div class="cap clip" id="cap-112" data-start="336.916" data-duration="3.817" data-track-index="0"><span>第四篇，Devin 加上了记忆和做梦机制</span></div>
<div class="cap clip" id="cap-113" data-start="340.903" data-duration="2.92" data-track-index="0"><span>记忆就存在一个 Git 仓库里</span></div>
<div class="cap clip" id="cap-114" data-start="343.823" data-duration="2.68" data-track-index="0"><span>用 MEMORY.md 做索引</span></div>
<div class="cap clip" id="cap-115" data-start="346.503" data-duration="1.44" data-track-index="0"><span>Agent 按需检索</span></div>
<div class="cap clip" id="cap-116" data-start="347.943" data-duration="2.443" data-track-index="0"><span>不把全部记忆塞进提示词</span></div>
<div class="cap clip" id="cap-117" data-start="350.556" data-duration="2.38" data-track-index="0"><span>多个会话同时写入时</span></div>
<div class="cap clip" id="cap-118" data-start="352.936" data-duration="4.103" data-track-index="0"><span>用版本检查拒绝过期的写入，冲突交给人来处理</span></div>
<div class="cap clip" id="cap-119" data-start="357.739" data-duration="3.92" data-track-index="0"><span>自己做 Agent 记忆的话</span></div>
<div class="cap clip" id="cap-120" data-start="361.659" data-duration="3.34" data-track-index="0"><span>Markdown 加 Git 加索引文件</span></div>
<div class="cap clip" id="cap-121" data-start="364.999" data-duration="1.823" data-track-index="0"><span>这套可以直接照搬</span></div>
<div class="cap clip" id="cap-122" data-start="367.522" data-duration="3.22" data-track-index="0"><span>第五篇来自 htmx 的作者</span></div>
<div class="cap clip" id="cap-123" data-start="370.742" data-duration="1.32" data-track-index="0"><span>他观察到</span></div>
<div class="cap clip" id="cap-124" data-start="372.062" data-duration="2.6" data-track-index="0"><span>重度使用编程 Agent 的公司里</span></div>
