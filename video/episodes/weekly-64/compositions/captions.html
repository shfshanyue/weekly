<div class="cap clip" id="cap-0" data-start="0.7" data-duration="3.042" data-track-index="0"><span>这里是开发者 AI 周刊第 64 期</span></div>
<div class="cap clip" id="cap-1" data-start="3.912" data-duration="3.1" data-track-index="0"><span>这一期的卷首想说：少拆 subagent</span></div>
<div class="cap clip" id="cap-2" data-start="7.012" data-duration="1.327" data-track-index="0"><span>多管上下文</span></div>
<div class="cap clip" id="cap-3" data-start="8.739" data-duration="2.22" data-track-index="0"><span>去年搭 Agent 的标准姿势</span></div>
<div class="cap clip" id="cap-4" data-start="10.959" data-duration="1.684" data-track-index="0"><span>是先画一张组织架构图</span></div>
<div class="cap clip" id="cap-5" data-start="12.813" data-duration="2.54" data-track-index="0"><span>最上面一个 router 判断意图</span></div>
<div class="cap clip" id="cap-6" data-start="15.353" data-duration="2.32" data-track-index="0"><span>下面一个 planner 拆任务</span></div>
<div class="cap clip" id="cap-7" data-start="17.673" data-duration="2.49" data-track-index="0"><span>再挂几个领域 subagent</span></div>
<div class="cap clip" id="cap-8" data-start="20.333" data-duration="3.4" data-track-index="0"><span>图很好看，可用户的一句关键约束</span></div>
<div class="cap clip" id="cap-9" data-start="23.733" data-duration="3.088" data-track-index="0"><span>常常在第二跳的交接摘要里被丢掉了</span></div>
<div class="cap clip" id="cap-10" data-start="26.991" data-duration="3.2" data-track-index="0"><span>每多一跳，就多一次模型调用</span></div>
<div class="cap clip" id="cap-11" data-start="30.191" data-duration="3.596" data-track-index="0"><span>多一份系统提示词，也多一次信息被压缩</span></div>
<div class="cap clip" id="cap-12" data-start="34.187" data-duration="2.7" data-track-index="0"><span>Anthropic 这周写了一篇文章</span></div>
<div class="cap clip" id="cap-13" data-start="36.887" data-duration="3.481" data-track-index="0"><span>讲什么时候该把 subagent 合回主循环</span></div>
<div class="cap clip" id="cap-14" data-start="40.538" data-duration="2.7" data-track-index="0"><span>他们发现，很多企业的 Agent 架构</span></div>
<div class="cap clip" id="cap-15" data-start="43.238" data-duration="2.127" data-track-index="0"><span>成了组织架构图的复制品</span></div>
<div class="cap clip" id="cap-16" data-start="45.535" data-duration="1.18" data-track-index="0"><span>当初拆分</span></div>
<div class="cap clip" id="cap-17" data-start="46.715" data-duration="2.847" data-track-index="0"><span>很大程度是因为上下文装不下所有领域知识</span></div>
<div class="cap clip" id="cap-18" data-start="49.732" data-duration="2.52" data-track-index="0"><span>现在 skills 和 tool search</span></div>
<div class="cap clip" id="cap-19" data-start="52.252" data-duration="3.291" data-track-index="0"><span>只放一段简短描述，用到时才完整加载</span></div>
<div class="cap clip" id="cap-20" data-start="55.943" data-duration="1.16" data-track-index="0"><span>结果是</span></div>
<div class="cap clip" id="cap-21" data-start="57.103" data-duration="1.8" data-track-index="0"><span>带 skills 的单个 Agent</span></div>
<div class="cap clip" id="cap-22" data-start="58.903" data-duration="4.144" data-track-index="0"><span>质量上常常同时赢过一个大提示词和 subagent 两种设计</span></div>
<div class="cap clip" id="cap-23" data-start="63.217" data-duration="3.165" data-track-index="0"><span>每个任务的成本和延迟，往往还更低</span></div>
<div class="cap clip" id="cap-24" data-start="66.552" data-duration="1.66" data-track-index="0"><span>Claude Code 自己</span></div>
<div class="cap clip" id="cap-25" data-start="68.212" data-duration="3.475" data-track-index="0"><span>也给更强的模型把系统提示词砍掉了八成以上</span></div>
<div class="cap clip" id="cap-26" data-start="72.087" data-duration="1.52" data-track-index="0"><span>例子不止一个</span></div>
<div class="cap clip" id="cap-27" data-start="73.607" data-duration="2.38" data-track-index="0"><span>LangChain 总结的公司 harness</span></div>
<div class="cap clip" id="cap-28" data-start="75.987" data-duration="3.06" data-track-index="0"><span>核心是一个带沙箱、凭证和记忆的执行环境</span></div>
<div class="cap clip" id="cap-29" data-start="79.047" data-duration="1.775" data-track-index="0"><span>而不是一棵 Agent 树</span></div>
<div class="cap clip" id="cap-30" data-start="80.992" data-duration="3.52" data-track-index="0"><span>AI21 给 GitLab Duo 做代码评审</span></div>
<div class="cap clip" id="cap-31" data-start="84.512" data-duration="2.414" data-track-index="0"><span>靠换小模型加压缩上下文降本</span></div>
<div class="cap clip" id="cap-32" data-start="87.096" data-duration="1.9" data-track-index="0"><span>每个 PR 的成本</span></div>
<div class="cap clip" id="cap-33" data-start="88.996" data-duration="3.235" data-track-index="0"><span>从 0.589 美元降到 0.0135 美元</span></div>
<div class="cap clip" id="cap-34" data-start="92.631" data-duration="1.96" data-track-index="0"><span>当然也有保留意见</span></div>
<div class="cap clip" id="cap-35" data-start="94.591" data-duration="2.528" data-track-index="0"><span>subagent 仍有两个站得住的理由</span></div>
<div class="cap clip" id="cap-36" data-start="97.289" data-duration="1.76" data-track-index="0"><span>一是权限隔离</span></div>
<div class="cap clip" id="cap-37" data-start="99.049" data-duration="2.2" data-track-index="0"><span>读不可信网页的那个 Agent</span></div>
<div class="cap clip" id="cap-38" data-start="101.249" data-duration="1.729" data-track-index="0"><span>不该同时拿着生产密钥</span></div>
<div class="cap clip" id="cap-39" data-start="103.148" data-duration="2.02" data-track-index="0"><span>二是真正的并行</span></div>
<div class="cap clip" id="cap-40" data-start="105.168" data-duration="2.8" data-track-index="0"><span>十个互不依赖的检索任务分出去跑</span></div>
<div class="cap clip" id="cap-41" data-start="107.968" data-duration="1.545" data-track-index="0"><span>墙钟时间确实能省</span></div>
<div class="cap clip" id="cap-42" data-start="109.683" data-duration="4.28" data-track-index="0"><span>另外，这些数字多是厂商自述，换到你的任务上</span></div>
<div class="cap clip" id="cap-43" data-start="113.963" data-duration="1.04" data-track-index="0"><span>要自己再测</span></div>
<div class="cap clip" id="cap-44" data-start="115.403" data-duration="3.48" data-track-index="0"><span>所以我的判断是：拆 subagent</span></div>
<div class="cap clip" id="cap-45" data-start="118.883" data-duration="3.532" data-track-index="0"><span>应该是为了隔离和并行，而不是为了装下知识</span></div>
<div class="cap clip" id="cap-46" data-start="122.585" data-duration="4.36" data-track-index="0"><span>已有多层架构的团队，先盘点哪些层只做转发</span></div>
<div class="cap clip" id="cap-47" data-start="126.945" data-duration="1.86" data-track-index="0"><span>把它们并回主循环</span></div>
<div class="cap clip" id="cap-48" data-start="128.805" data-duration="1.93" data-track-index="0"><span>领域知识改成 skills</span></div>
<div class="cap clip" id="cap-49" data-start="130.905" data-duration="2.68" data-track-index="0"><span>合并前后用同一组 eval，比成功率</span></div>
<div class="cap clip" id="cap-50" data-start="133.585" data-duration="3.377" data-track-index="0"><span>每任务成本和延迟，再决定下一层要不要动</span></div>
<div class="cap clip" id="cap-51" data-start="137.362" data-duration="2.55" data-track-index="0"><span>接下来，过一遍本周快讯</span></div>

<div class="cap clip" id="cap-75" data-start="202.912" data-duration="2.86" data-track-index="0"><span>基线每个 PR 0.589 美元</span></div>
