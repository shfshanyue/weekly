  <text x="56.0" y="822.0" fill="#5f5a50" font-family="Arial,Helvetica,sans-serif" font-size="12">keepalive economics (paper); Cache Wars (vendor-authored); vLLM bi-directional KV transfer (vendor). Published constants only. Last verified 18 Oct 2026.</text>
