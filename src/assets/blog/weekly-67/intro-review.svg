<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690"><rect width="1400" height="690" rx="20" fill="#f1f4ed"/><g font-family="sans-serif"><text x="70" y="90" font-size="38" font-weight="700" fill="#183c3e">一次导入接口改动，合并前检查什么？</text><g fill="white" stroke="#b8cbbd" stroke-width="2"><rect x="70" y="145" width="390" height="290" rx="14"/><rect x="505" y="145" width="390" height="290" rx="14"/><rect x="940" y="145" width="390" height="290" rx="14"/></g><g fill="#183c3e" font-size="31"><text x="100" y="208">真实改动</text><text x="535" y="208">运行证据</text><text x="970" y="208">回滚条件</text></g><g fill="#41635c" font-size="26"><text x="100" y="280">哪些字段或校验变了？</text><text x="100" y="330">写入前后有何差别？</text><text x="100" y="380">旧客户端还能用吗？</text><text x="535" y="280">重复请求的测试</text><text x="535" y="330">中断恢复的样例</text><text x="535" y="380">日志与实现能否对应</text><text x="970" y="280">谁负责判断失败？</text><text x="970" y="330">怎样撤回本次改动？</text><text x="970" y="380">已写数据怎样处理？</text></g><rect x="70" y="475" width="1260" height="105" fill="#dbe9d6" rx="12"/><text x="110" y="540" font-size="30" fill="#183c3e">解释不清影响范围，或缺少关键证据 → 先补齐，不靠增加并行任务赶进度</text><text x="70" y="635" fill="#60766e" font-size="22">编辑示意：这是审查建议，不是采样定理推导出的频率要求，也不是实验数据。</text></g></svg>